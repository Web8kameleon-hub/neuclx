name: NeuCLX CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  standard-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce the single main tree
        env:
          NEUCLX_GIT_REF: ${{ github.ref }}
          NEUCLX_EVENT: ${{ github.event_name }}
          NEUCLX_HEAD_REF: ${{ github.head_ref }}
        run: python scripts/enforce_main_only.py
      - name: Validate 16-repository import provenance and deduplication
        run: python scripts/validate_import_candidates.py
      - name: Verify release tag belongs to main history
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q src tests build_backend
      - name: Test
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
