name: NeuCLX Release Provenance

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce tag and main ancestry
        env:
          NEUCLX_GIT_REF: ${{ github.ref }}
          NEUCLX_EVENT: ${{ github.event_name }}
        run: |
          python scripts/enforce_main_only.py
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Test
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -v
      - name: Resolve release version
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "${GITHUB_ENV}"
      - name: Build release evidence
        run: python scripts/build_release.py --version "${RELEASE_VERSION}" --commit "${GITHUB_SHA}" --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}"
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest SPDX SBOM
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/neuclx-${{ env.RELEASE_VERSION }}.sbom.spdx.json
      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: neuclx-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
