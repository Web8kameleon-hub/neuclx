name: NeuCLX Release Provenance

on:
  push:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce main-only ref
        env:
          NEUCLX_GIT_REF: ${{ github.ref }}
          NEUCLX_EVENT: ${{ github.event_name }}
        run: |
          python scripts/enforce_main_only.py
      - name: Test
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -v
      - name: Build main commit candidate
        run: python scripts/build_release.py --version 0.1.0 --commit "${GITHUB_SHA}" --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}"
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest SPDX SBOM
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/neuclx-0.1.0.sbom.spdx.json
      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: neuclx-main-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
